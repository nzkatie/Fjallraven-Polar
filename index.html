<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="Fjallraven Polar application by Katie Ensor." />
    <title>Fjällräven Polar | Application - Katie Ensor</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f4f0;
        --ink: #182a29;
        --line: #dcded8;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: min(100% - 48px, 1200px); margin-inline: auto; }

      .site-header { border-bottom: 1px solid var(--line); }
      .header-inner {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px 28px;
        padding-block: 28px;
      }
      .brand {
        font-size: .9rem;
        font-weight: 800;
        letter-spacing: .04em;
        color: rgb(169, 61, 48);
        display: inline-block
      }
      .text-black {
        color: #1C1C1C
      }
      .application {
        color: #1C1C1C;
        font-size: .88rem;
        font-weight: 500;
        margin-left: auto;
        text-align: right;
        display: inline-block;
      }

      main { padding-block: clamp(24px, 5vw, 64px) clamp(60px, 9vw, 120px); }
      .application-video {
        display: block;
        width: 100%;
        max-width: 420px;
        margin-inline: auto;
        aspect-ratio: 9 / 16;
        background: #182d30;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(12px, 2vw, 24px);
        margin-top: clamp(24px, 4vw, 48px);
      }
      .gallery img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 640px) {
        .wrap { width: min(100% - 32px, 1200px); }
        .header-inner { padding-block: 20px; gap: 4px 16px; }
        .brand { font-size: .82rem; }
        .application { font-size: .8rem; }
        .gallery { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <span class="brand">Fjällräven <span class="text-black">Polar</span></span>
        <span class="application">Application - Katie Ensor</span>
      </div>
    </header>

    <main class="wrap">
      <video class="application-video" controls playsinline preload="metadata" aria-label="Katie Ensor's Fjällräven Polar application video">
        <source src="media/Katies%20Fjallraven%20Application%281%29.mp4" type="video/mp4" />
        Your browser does not support HTML video.
      </video>

      <div class="gallery" aria-label="Image gallery">
        <img src="media/image0.jpeg" alt="Katie hiking beside a turquoise river with snow-capped mountains beyond" width="4284" height="5712" loading="lazy" decoding="async" />
        <img src="media/image1.jpeg" alt="Katie walking along a boardwalk in front of a mountain at sunset" width="4284" height="5712" loading="lazy" decoding="async" />
        <img src="media/image2.jpeg" alt="Katie on a ferry beside a campervan at sunset" width="1536" height="2048" loading="lazy" decoding="async" />
        <img src="media/image3.jpeg" alt="Katie standing beneath the Queenstown street sign" width="1289" height="1711" loading="lazy" decoding="async" />
      </div>
    </main>
  </body>
</html>
